<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>With Your Destiny Ⅲ</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <header>
    <h1>With Your Destiny Ⅲ <small>最小版</small></h1>
    <div class="controls">
      <span>キャラ</span>
      <select id="class-select" title="職業を切り替える（キャラごとにセーブは別々）"></select>
      <span class="sep"></span>
      <span>エリア</span>
      <button id="area-down" title="前のエリアへ">◀</button>
      <b id="area-name"></b>
      <button id="area-up" title="次のエリアへ">▶</button>
      <span id="boss-progress" class="muted"></span>
      <span class="sep"></span>
      <span>危険度</span>
      <button id="diff-down" title="危険度を下げる">◀</button>
      <b id="diff-value">1</b>
      <button id="diff-up" title="危険度を上げる">▶</button>
      <label title="新しい危険度が解放されたら自動で上げ、何度も倒れたら1つ下げる"><input type="checkbox" id="auto-diff"> 自動</label>
      <span id="diff-progress" class="muted"></span>
      <span id="trial-group" hidden>
        <span class="sep"></span>
        <span>試練</span>
        <button id="trial-down" title="段階を下げる">◀</button>
        <b id="trial-level">1</b>
        <button id="trial-up" title="段階を上げる（最高記録の次まで）">▶</button>
        <button id="trial-start" title="制限時間内に決まった数を倒し、守護者を討つ">挑む</button>
        <label title="成功したら次の段階、失敗したら1つ下の段階で自動で続ける"><input type="checkbox" id="trial-auto"> 連続</label>
        <span id="trial-best" class="muted"></span>
        <button id="daily-start">日替わり</button>
      </span>
      <span class="sep"></span>
      <span>速度</span>
      <button data-speed="1">×1</button>
      <button data-speed="2">×2</button>
      <button data-speed="4">×4</button>
      <span class="sep"></span>
      <label title="拾った装備が今より強ければ自動で着替える（ユニーク・セット・強化や宝石つきの装備は外さない）"><input type="checkbox" id="auto-equip"> 自動装備</label>
      <label>自動分解 <select id="auto-salvage" title="選んだレア度以下の装備は、拾わずにその場で素材にする"></select></label>
      <span class="sep"></span>
      <button id="sound-toggle" title="効果音（最初に画面をクリックすると鳴りはじめる）">音：ON</button>
      <button id="help">遊び方</button>
      <button id="codex-open" title="図鑑（集めたユニーク・セット装備）、記録、実績">図鑑と記録</button>
      <button id="backup-export" title="全部のキャラのセーブを1つのファイルに保存する">セーブを書き出す</button>
      <button id="backup-import" title="書き出したファイルからセーブを戻す">読み込む</button>
      <input type="file" id="backup-file" accept=".json,application/json" hidden>
      <button id="reset" class="danger">最初から</button>
    </div>
  </header>

  <main>
    <div class="left">
      <canvas id="game" width="960" height="600"></canvas>
      <section class="panel">
        <h2>ログ</h2>
        <div id="log"></div>
      </section>
    </div>

    <aside>
      <section class="panel">
        <h2 id="char-name">Lv 1</h2>
        <div class="bar"><div id="hp-bar" class="fill hp"></div><span id="hp-text"></span></div>
        <div class="bar"><div id="exp-bar" class="fill exp"></div><span id="exp-text"></span></div>
        <div id="stats" class="stats"></div>
        <div id="paragon" class="build" hidden></div>
        <div id="build" class="build"></div>
      </section>

      <section class="panel">
        <h2>スキル <small>残りポイント：<b id="skill-points">0</b>　使用中：<b id="skill-slots"></b></small></h2>
        <div id="skills"></div>
      </section>

      <section class="panel">
        <h2>装備 <small>クリックで外す</small></h2>
        <div id="equipment" class="grid"></div>
      </section>

      <section class="panel">
        <h2>持ち物 <small id="inv-count"></small> <small id="materials"></small></h2>
        <div id="inventory" class="grid"></div>
        <div class="inv-buttons">
          <button id="discard-normal">ノーマルを全部捨てる</button>
          <button id="discard-magic">マジック以下を全部捨てる</button>
          <button id="craft-mode">つけ直しモード：OFF</button>
          <button id="enhance-mode">強化モード：OFF</button>
        </div>
        <p class="muted" id="inv-help">左クリック：装備する／右クリック：捨てる（捨てると素材になる）</p>
      </section>

      <section class="panel">
        <h2>宝石 <small class="muted">選んでから装備をクリックすると、空いたソケットにはめる</small></h2>
        <div id="gems"></div>
      </section>

      <section class="panel">
        <h2>倉庫 <small id="stash-count"></small> <button id="stash-toggle">開く</button></h2>
        <div id="stash-body" hidden>
          <div id="stash" class="grid"></div>
          <p class="muted">クリック：持ち物へ戻す／右クリック：捨てる。持ち物を倉庫に入れるときは Shift＋クリック</p>
        </div>
      </section>
    </aside>
  </main>

  <div id="tooltip"></div>

  <div id="codex" class="modal" hidden>
    <div class="modal-box codex-box">
      <h2>図鑑と記録</h2>
      <div id="codex-body"></div>
      <button id="codex-close">閉じる</button>
    </div>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <h2 id="modal-title"></h2>
      <p id="modal-text"></p>
      <ul id="modal-list"></ul>
      <button id="modal-ok">続ける</button>
    </div>
  </div>

  <!-- 数値（data/） -->
  <script src="data/player.js"></script>
  <script src="data/skills.js"></script>
  <script src="data/enemies.js"></script>
  <script src="data/elites.js"></script>
  <script src="data/map.js"></script>
  <script src="data/areas.js"></script>
  <script src="data/items.js"></script>
  <script src="data/effects.js"></script>
  <script src="data/crafting.js"></script>
  <script src="data/uniques.js"></script>
  <script src="data/offline.js"></script>
  <script src="data/story.js"></script>
  <script src="data/fx.js"></script>
  <script src="data/anim.js"></script>
  <script src="data/sound.js"></script>
  <script src="data/classes.js"></script>
  <script src="data/vfx.js"></script>
  <script src="data/runes.js"></script>
  <script src="data/sets.js"></script>
  <script src="data/trial.js"></script>
  <script src="data/records.js"></script>
  <script src="data/gems.js"></script>
  <script src="data/daily.js"></script>
  <!-- しくみと画面（src/） -->
  <script src="src/util.js"></script>
  <script src="src/save.js"></script>
  <script src="src/classes.js"></script>
  <script src="src/stats.js"></script>
  <script src="src/loot.js"></script>
  <script src="src/inventory.js"></script>
  <script src="src/world.js"></script>
  <script src="src/fx.js"></script>
  <script src="src/vfx.js"></script>
  <script src="src/runes.js"></script>
  <script src="src/trial.js"></script>
  <script src="src/records.js"></script>
  <script src="src/gems.js"></script>
  <script src="src/daily.js"></script>
  <script src="src/sound.js"></script>
  <script src="src/offline.js"></script>
  <script src="src/render.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
