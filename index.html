<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>With Your Destiny Ⅲ</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <header>
    <h1>With Your Destiny Ⅲ <small>最小版</small></h1>
    <div class="controls">
      <span>エリア</span>
      <button id="area-down" title="前のエリアへ">◀</button>
      <b id="area-name"></b>
      <button id="area-up" title="次のエリアへ">▶</button>
      <span id="boss-progress" class="muted"></span>
      <span class="sep"></span>
      <span>危険度</span>
      <button id="diff-down" title="危険度を下げる">◀</button>
      <b id="diff-value">1</b>
      <button id="diff-up" title="危険度を上げる">▶</button>
      <label title="新しい危険度が解放されたら自動で上げ、何度も倒れたら1つ下げる"><input type="checkbox" id="auto-diff"> 自動</label>
      <span id="diff-progress" class="muted"></span>
      <span class="sep"></span>
      <span>速度</span>
      <button data-speed="1">×1</button>
      <button data-speed="2">×2</button>
      <button data-speed="4">×4</button>
      <span class="sep"></span>
      <label>自動分解 <select id="auto-salvage" title="選んだレア度以下の装備は、拾わずにその場で素材にする"></select></label>
      <span class="sep"></span>
      <button id="sound-toggle" title="効果音（最初に画面をクリックすると鳴りはじめる）">音：ON</button>
      <button id="help">遊び方</button>
      <button id="reset" class="danger">最初から</button>
    </div>
  </header>

  <main>
    <div class="left">
      <canvas id="game" width="960" height="600"></canvas>
      <section class="panel">
        <h2>ログ</h2>
        <div id="log"></div>
      </section>
    </div>

    <aside>
      <section class="panel">
        <h2 id="char-name">Lv 1</h2>
        <div class="bar"><div id="hp-bar" class="fill hp"></div><span id="hp-text"></span></div>
        <div class="bar"><div id="exp-bar" class="fill exp"></div><span id="exp-text"></span></div>
        <div id="stats" class="stats"></div>
        <div id="build" class="build"></div>
      </section>

      <section class="panel">
        <h2>スキル <small>残りポイント：<b id="skill-points">0</b>　使用中：<b id="skill-slots"></b></small></h2>
        <div id="skills"></div>
      </section>

      <section class="panel">
        <h2>装備 <small>クリックで外す</small></h2>
        <div id="equipment" class="grid"></div>
      </section>

      <section class="panel">
        <h2>持ち物 <small id="inv-count"></small> <small id="materials"></small></h2>
        <div id="inventory" class="grid"></div>
        <div class="inv-buttons">
          <button id="discard-normal">ノーマルを全部捨てる</button>
          <button id="discard-magic">マジック以下を全部捨てる</button>
          <button id="craft-mode">つけ直しモード：OFF</button>
        </div>
        <p class="muted" id="inv-help">左クリック：装備する／右クリック：捨てる（捨てると素材になる）</p>
      </section>

      <section class="panel">
        <h2>倉庫 <small id="stash-count"></small> <button id="stash-toggle">開く</button></h2>
        <div id="stash-body" hidden>
          <div id="stash" class="grid"></div>
          <p class="muted">クリック：持ち物へ戻す／右クリック：捨てる。持ち物を倉庫に入れるときは Shift＋クリック</p>
        </div>
      </section>
    </aside>
  </main>

  <div id="tooltip"></div>

  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <h2 id="modal-title"></h2>
      <p id="modal-text"></p>
      <ul id="modal-list"></ul>
      <button id="modal-ok">続ける</button>
    </div>
  </div>

  <!-- 数値（data/） -->
  <script src="data/player.js"></script>
  <script src="data/skills.js"></script>
  <script src="data/enemies.js"></script>
  <script src="data/elites.js"></script>
  <script src="data/map.js"></script>
  <script src="data/areas.js"></script>
  <script src="data/items.js"></script>
  <script src="data/effects.js"></script>
  <script src="data/crafting.js"></script>
  <script src="data/uniques.js"></script>
  <script src="data/offline.js"></script>
  <script src="data/story.js"></script>
  <script src="data/fx.js"></script>
  <script src="data/anim.js"></script>
  <script src="data/sound.js"></script>
  <!-- しくみと画面（src/） -->
  <script src="src/util.js"></script>
  <script src="src/save.js"></script>
  <script src="src/stats.js"></script>
  <script src="src/loot.js"></script>
  <script src="src/inventory.js"></script>
  <script src="src/world.js"></script>
  <script src="src/fx.js"></script>
  <script src="src/sound.js"></script>
  <script src="src/offline.js"></script>
  <script src="src/render.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
